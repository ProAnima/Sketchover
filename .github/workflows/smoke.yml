# Проверка установщиков запуском на чистых машинах Windows, macOS и Linux: установить так же,
# как пользователь, запустить, убедиться, что программа жива, создала настройки и что холст
# прозрачный (снимки экрана до и после — scripts/smoke-transparency.py).
# Из release.yml — для черновика перед публикацией; вручную — для любого тега.
name: Smoke

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Тег релиза, например v0.1.0 (пусто — последний опубликованный)
        required: false
  pull_request:
    paths: [".github/workflows/smoke.yml", "scripts/smoke-*.py"]

# Запись — не для изменений: черновик релиза виден только с правом записи. Вызванный
# из release.yml workflow может лишь урезать права, поэтому они нужны здесь, а не только там.
permissions:
  contents: write

env:
  REPO: ${{ github.repository }}
  GH_TOKEN: ${{ github.token }}
  # Сколько секунд программа должна проработать без падения.
  ALIVE_SECONDS: 15

jobs:
  smoke:
    name: Smoke (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest
          - name: Linux
            os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts

      - name: Release tag
        shell: bash
        run: |
          tag="${{ inputs.tag }}"
          [ -n "$tag" ] || tag="$(gh release view --repo "$REPO" --json tagName -q .tagName)"
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "Проверяем $tag"
          mkdir -p smoke

      # ---------- Windows: тихая установка NSIS в профиль пользователя ----------
      - name: Install and run (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pip install --quiet pillow
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          function Shot($path) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save($path)
          }
          gh release download $env:TAG --repo $env:REPO -p "*_x64-setup.exe" -D dist
          $setup = Get-ChildItem dist\*_x64-setup.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList '/S' -Wait
          $exe = Get-ChildItem "$env:LOCALAPPDATA\Sketchover" -Filter *.exe | Where-Object Name -notmatch 'uninstall' | Select-Object -First 1
          if (-not $exe) { throw 'Программа не установилась' }
          "Установлено: $($exe.FullName)"
          Shot "smoke\windows-before.png"
          $p = Start-Process $exe.FullName -PassThru
          Start-Sleep $env:ALIVE_SECONDS
          if ($p.HasExited) { throw "Программа завершилась с кодом $($p.ExitCode)" }
          Shot "smoke\windows.png"
          $settings = "$env:APPDATA\studio.proanima.sketchover\settings.json"
          if (-not (Test-Path $settings)) { throw 'Настройки не созданы' }
          Stop-Process -Id $p.Id
          python scripts\smoke-transparency.py smoke\windows-before.png smoke\windows.png --require
          if ($LASTEXITCODE) { throw 'Холст не прозрачный' }

      # ---------- macOS: из DMG в «Программы» и запуск через open, как это делает человек ----------
      - name: Install and run (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --user --break-system-packages pillow
          gh release download "$TAG" --repo "$REPO" -p "*_universal.dmg" -D dist
          hdiutil attach dist/*_universal.dmg -mountpoint /Volumes/Sketchover -nobrowse
          ls -la /Volumes/Sketchover
          cp -R /Volumes/Sketchover/Sketchover.app /Applications/
          hdiutil detach /Volumes/Sketchover
          bin="$(ls /Applications/Sketchover.app/Contents/MacOS/* | head -1)"
          lipo -archs "$bin"
          echo "Без иконки в Dock (LSUIElement): $(defaults read /Applications/Sketchover.app/Contents/Info LSUIElement 2>/dev/null || echo нет)"
          # Под холстом — окно Finder, чтобы было что увидеть сквозь него.
          open /System/Applications
          sleep 3
          screencapture -x smoke/macos-before.png
          open /Applications/Sketchover.app
          sleep "$ALIVE_SECONDS"
          pid="$(pgrep -f "$bin" || true)"
          [ -n "$pid" ] || { echo "Программа не запущена"; exit 1; }
          screencapture -x smoke/macos.png
          test -f "$HOME/Library/Application Support/studio.proanima.sketchover/settings.json" || { echo "Настройки не созданы"; exit 1; }
          kill $pid
          python3 scripts/smoke-transparency.py smoke/macos-before.png smoke/macos.png --require

      # ---------- Linux: .deb через apt (проверяет зависимости пакета) и AppImage ----------
      - name: Install and run (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          # xcompmgr — композитор: без него в X11 прозрачных окон не бывает, на рабочем столе он есть.
          sudo apt-get install -y --no-install-recommends xvfb xauth dbus-x11 imagemagick \
            xcompmgr python3-pil python3-tk
          gh release download "$TAG" --repo "$REPO" -p "*_amd64.deb" -p "*_amd64.AppImage" -D dist
          sudo apt-get install -y ./dist/*_amd64.deb
          pkg="$(dpkg-deb -f dist/*_amd64.deb Package)"
          bin="$(dpkg -L "$pkg" | grep '^/usr/bin/' | head -1)"
          echo "Установлено: $pkg → $bin"
          chmod +x dist/*_amd64.AppImage
          appimage="$(ls dist/*_amd64.AppImage)"
          check() { # имя, команда…
            name="$1"; shift
            rm -rf "$HOME/.config/studio.proanima.sketchover"
            xvfb-run -a -s "-screen 0 1920x1080x24" dbus-run-session -- bash -c '
              set -e
              xcompmgr & sleep 1
              # Под холстом — синее окно во весь экран: фон корня композитор не рисует.
              python3 scripts/smoke-backdrop.py &
              sleep 2
              import -window root "smoke/linux-'"$name"'-before.png"
              "$@" > "smoke/'"$name"'-stdout.txt" 2> "smoke/'"$name"'-stderr.txt" &
              pid=$!
              sleep "$ALIVE_SECONDS"
              kill -0 "$pid" || { cat "smoke/'"$name"'-stderr.txt"; echo "Программа завершилась"; exit 1; }
              import -window root "smoke/linux-'"$name"'.png"
              kill "$pid"
            ' _ "$@"
            test -f "$HOME/.config/studio.proanima.sketchover/settings.json" || { echo "Настройки не созданы"; exit 1; }
            python3 scripts/smoke-transparency.py "smoke/linux-$name-before.png" "smoke/linux-$name.png" --require
            echo "$name: работает"
          }
          check deb "$bin"
          # На машинах CI нет FUSE — AppImage запускается с распаковкой.
          check appimage "$appimage" --appimage-extract-and-run

      - name: Screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.name }}
          path: smoke/
          if-no-files-found: ignore
